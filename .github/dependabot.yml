# Keeps the workflows' actions and the Python packages up to date. Updates
# arrive as pull requests, which the tests check like any other change. The
# program has one required dependency (see CONTRIBUTING.md); this does not
# add any.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 3
