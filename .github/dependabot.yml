# Keeps the workflows' actions and the Python packages up to date. Updates
# arrive as pull requests, which the tests check like any other change. The
# program has one required dependency (see CONTRIBUTING.md); this does not
# add any.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    # The files say "at least this version" and the program supports Python
    # 3.9, which newer fpdf2 and pillow-heif no longer install on. pip picks
    # the newest version each Python can use; raising the minimum to the
    # newest release would lock those users out. So only change a line when
    # the newest release no longer fits it.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "monthly"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 3
