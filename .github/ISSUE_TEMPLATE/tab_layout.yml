name: A tab is empty or wrong (layout report)
description: Help us read your iOS version's databases, by sharing how they are built, never what is in them
title: "[Layout] "
labels: ["compatibility", "layout-report", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post your backup, its password, or anything it contains** (no messages, names, numbers, places, photos, health values, or file paths that name you).

        When a tab shows nothing, or too little, for your iOS version, the cause is almost always that the database is **built differently** (a table or column has another name). A *layout report* shows exactly that and nothing else: for each database, its tables, their columns and **how many rows** each has. No row, text, name, number or date is printed.

        **How:**

        ```
        python tools/schema_report.py "<your backup folder>" --password-window
        ```

        That reports on every database the program reads, and lists the ones your backup does not have. To look at one file (add `--sql` for the `CREATE` statements, which are the layout as SQLite itself writes it, and are the most useful thing for a test):

        ```
        python tools/schema_report.py "<your backup folder>" --password-window --path "HomeDomain/Library/SMS/sms.db" --sql
        ```

        If you do not know where an app keeps its data, `--find notes` lists the database files whose path contains the word (a path can name an app you have installed, so look before you post it).

        Read the output before you post it. [How to help safely](https://github.com/slammingprogramming/iOS-backup-explorer/blob/main/docs/HELPING.md).
  - type: dropdown
    id: tab
    attributes:
      label: Which tab?
      options:
        - Messages
        - Notes
        - Calls
        - Contacts
        - Photos
        - Voice Memos
        - Safari
        - Calendar
        - Voicemail
        - Reminders
        - Network
        - Accounts
        - Keychain
        - Screen Time
        - Health
        - Maps
        - Podcasts
        - Books
        - Recents
        - Privacy
        - Apps
        - iCloud Drive
        - Not an existing tab (an app the program does not read yet)
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: "12.4.8"
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What you see, and what you expected
      description: "The shape only: \"the tab says there is nothing\", \"the list stops at 2019\", \"dates are all 2001\"."
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: The layout report
      description: Paste the output (or the part for the database in question).
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: The CREATE statements (optional)
      description: "From `--sql`. Only the layout; there are no rows in it."
      render: sql
    validations:
      required: false
  - type: dropdown
    id: followup
    attributes:
      label: Could you try a fix?
      description: A fix is usually tested by running the new version and describing what it shows, never by sending the backup.
      options:
        - "Yes, I can try a fix on my backup"
        - "Maybe, ask me"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I read the output and it holds only table and column names and counts. I did not add my backup or any of its contents.
          required: true
