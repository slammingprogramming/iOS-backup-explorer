name: Tests

on:
  push:
  pull_request:
  # the release workflow runs the same checks before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        # ubuntu-latest became Ubuntu 26.04, for which actions/setup-python
        # has no Python 3.9 build (the release of 2.5.0 was stopped by that),
        # and 3.9 is the oldest version the program promises to support. So
        # 3.9 runs on 24.04, which has it; the newest Python runs on the
        # newest image. When 24.04 is retired, look here first.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The GUI tests skip themselves when no display is available.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  # The same tests with the optional packages installed (picture previews,
  # HEIC photos, PDF export), which the job above runs without.
  tests-with-extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-optional.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
