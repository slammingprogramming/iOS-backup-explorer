name: Labels

# Creates or updates the labels listed in .github/labels.yml (the issue forms
# and Dependabot attach some of them). Run it by hand after changing the file.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create or update the labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sync_labels.py
