name: Attribution check

on:
  push:
  pull_request:
  # the release workflow runs the same checks before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original author credit and license notices
        run: python tools/check_attribution.py
      - name: Verify the version is consistent
        run: python tools/check_version.py
