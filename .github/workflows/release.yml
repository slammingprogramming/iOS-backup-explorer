name: Release

# Pushing a version tag publishes a GitHub release: the changelog section as
# its notes, a .zip and a .tar.gz of the tagged files, and their SHA-256
# sums. See docs/VERSIONING.md, "Making a release".
#
#   git tag -s v2.1.0 -m "iOS Backup Explorer 2.1.0"
#   git push origin v2.1.0
#
# A pre-release tag (v2.1.0-rc.1) makes a pre-release. To redo a release whose
# publishing step failed, run this workflow by hand from the tag
# ("Use workflow from": the tag); it updates the release in place.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Is this tag a release at all? The tag must be "v" + __version__, the
  # changelog and README badge must agree, and the commit must be on the
  # default branch (a tag on a side branch is not published).
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Only tags can be released
        if: github.ref_type != 'tag'
        run: |
          echo "Run this workflow from a version tag, not from a branch." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag against the code and the changelog
        run: python tools/release.py verify "$GITHUB_REF_NAME"
      - name: Check the commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_REF_NAME is not on $DEFAULT_BRANCH; not releasing." >&2
            exit 1
          fi

  # The same checks as for every push, on the tagged commit.
  tests:
    needs: verify
    uses: ./.github/workflows/tests.yml

  attribution:
    needs: verify
    uses: ./.github/workflows/attribution.yml

  publish:
    needs: [verify, tests, attribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the downloads
        run: python tools/release.py build "$TAG" --out dist

      - name: Write the release notes
        run: |
          python tools/release.py notes "$TAG" > notes.md
          # link to what changed since the release before this one, if any
          if previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null); then
            printf '**Full comparison**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          fi
          cat notes.md

      - name: Publish the release
        run: |
          version="${TAG#v}"
          kind=$(python tools/release.py prerelease "$TAG")
          if [ "$kind" = "true" ]; then flag="--prerelease"; else flag="--latest"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run: update the release, never move the tag
            gh release edit "$TAG" --title "iOS Backup Explorer $version" \
              --notes-file notes.md "$flag"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "iOS Backup Explorer $version" \
              --notes-file notes.md "$flag"
          fi
          gh release view "$TAG" --json url --jq .url

      - name: Keep the files with the run as well
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            notes.md
